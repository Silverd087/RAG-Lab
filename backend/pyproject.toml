[project]
name = "rag-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "celery>=5.6.3",
    "datasets>=5.0.0",
    "deepeval>=4.0.6",
    "fastapi>=0.137.1",
    "fastembed>=0.8.0",
    "filetype>=1.2.0",
    "google-cloud-aiplatform>=1.158.0",
    "langchain>=1.3.4",
    "langchain-anthropic>=1.4.8",
    "langchain-classic>=1.0.7",
    "langchain-cohere>=0.6.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.1",
    "langchain-experimental>=0.4.2",
    "langchain-google-genai>=4.2.4",
    "langchain-google-vertexai>=3.2.4",
    "langchain-huggingface>=1.2.2",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langchain-unstructured>=1.0.1",
    "langchain-voyageai>=0.4.0",
    "langsmith>=0.8.9",
    "minio>=7.2.20",
    "pika>=1.4.1",
    "psycopg2-binary>=2.9.12",
    "pypdf>=6.13.1",
    "pytest-cov>=7.1.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.18.0",
    "redis>=8.0.1",
    "sentence-transformers>=5.5.1",
    "unstructured[pdf]>=0.16",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = [
    "-p", "pytest_cov",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html"
]

[tool.coverage.run]
branch = true
concurrency = ["greenlet"]
